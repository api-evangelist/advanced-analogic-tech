name: Advanced Analogic Technologies (AnalogicTech)
description: >-
  Advanced Analogic Technologies Incorporated (AnalogicTech, formerly NASDAQ: AATI) was a
  fabless semiconductor company founded in 1997 and headquartered in Santa Clara, California,
  with design centers in Santa Clara and Shanghai. The company designed total power-management
  solutions built on proprietary analog and mixed-signal integrated circuits and discrete power
  MOSFETs, shipping a portfolio of more than 500 power-management application-specific standard
  products (ASSPs) and general-purpose analog ICs across four application areas: display and
  lighting, voltage regulation and DC/DC conversion, interface and power management, and battery
  management, primarily for mobile and portable consumer electronics. Advanced Analogic
  Technologies was acquired by Skyworks Solutions, Inc. in January 2011 and no longer operates as
  an independent company; it is a hardware semiconductor manufacturer with no public web API,
  developer platform, or API artifacts. This profile is retained in the API Evangelist network as
  a company record rather than an active API provider.
